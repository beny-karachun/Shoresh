name: Deploy static site to GitHub Pages

# Publishes the client-side site in static_site/ to GitHub Pages.
# In the repo Settings -> Pages, set "Source" to "GitHub Actions" (one-time).

on:
  push:
    branches: [main]
    paths:
      - 'static_site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static_site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./static_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
